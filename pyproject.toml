[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transparent-deep-research"
version = "0.1.0"
description = "Bounded three-role research with a transparent evidence ledger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deep-research = "deep_research.cli:main"

[tool.setuptools.packages.find]
include = ["deep_research*"]
