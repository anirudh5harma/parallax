services:
  - type: web
    name: parallax-research-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: deep-research-api --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_WEB_MODEL_ID
        value: us.anthropic.claude-opus-4-6-v1
      - key: WEB_ALLOWED_ORIGINS
        sync: false
      - key: WEB_ALLOWED_HOSTS
        sync: false
